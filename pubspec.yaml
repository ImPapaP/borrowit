name: borrowit
description: "BorrowIT - student equipment borrowing app (Flutter + Firebase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase: login and database
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

  # Camera / gallery, and saving the photo on the phone
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  web: ^1.1.0 # browser downloads (website only)

  # Local notifications (status updates and reminders)
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  shared_preferences: ^2.5.3

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/equipment/
